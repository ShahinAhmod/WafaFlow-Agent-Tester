name: WafaFlow Agent Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  test:
    name: Run Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install openai pydantic pytest

      - name: Unit test core engines
        run: pytest test_core_engines.py -v

      - name: Run test suite
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_all_tests.py

      - name: Evaluate results
        run: python ci_check.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            latest_results.json
            results_history.json

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Test results unavailable.';
            try {
              const data = JSON.parse(fs.readFileSync('latest_results.json', 'utf8'));
              summary = `Passed: ${data.passed} | Failed: ${data.failed} | Pass Rate: ${data.pass_rate}%`;
            } catch {}
            github.rest.issues.createComment({
              issue_number: context.issue?.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ WafaFlow Agent Tests Failed\n\n${summary}\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for full details.`
            }).catch(() => {});  // not a PR — skip comment silently
